<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map · AgriPulse Rwanda</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="/css/style.css" rel="stylesheet"></head>
<body><div id="nav"></div>
<main class="section"><div class="container"><h1>Rwanda agricultural intelligence map</h1>
<div class="row g-2 mb-3"><div class="col-6 col-md-3"><label class="form-label" for="fProvince">Province</label><select id="fProvince" class="form-select"></select></div>
<div class="col-6 col-md-3"><label class="form-label" for="fDistrict">District</label><select id="fDistrict" class="form-select"></select></div>
<div class="col-6 col-md-3"><label class="form-label" for="fSeason">Season</label><select id="fSeason" class="form-select"></select></div>
<div class="col-6 col-md-3"><label class="form-label" for="fCrop">Crop</label><select id="fCrop" class="form-select"></select></div></div>
<div id="map" role="application" aria-label="Map of Rwanda districts"></div>
<p class="note mt-2"><span id="count"></span> · Marker colour = risk level: <span class="badge-risk b-LOW">LOW</span> <span class="badge-risk b-MEDIUM">MEDIUM</span> <span class="badge-risk b-HIGH">HIGH</span>. Marker positions are approximate district centres.</p></div></main>
<footer><div class="container">AgriPulse Rwanda · NISR Big Data Hackathon 2026 · Source: NISR Seasonal Agricultural Survey 2024. Associations shown are observational, not causal.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/common.js"></script><script src="/js/map.js"></script>
</body></html>
